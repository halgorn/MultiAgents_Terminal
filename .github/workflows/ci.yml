name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        env:
          AION_SKIP_UPDATE_CHECK: "1"
          ANTHROPIC_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          VOYAGE_API_KEY: ""
          QDRANT_URL: ""
        run: node --import tsx --test "src/**/*.test.ts"

      - name: Local scans
        env:
          AION_SKIP_UPDATE_CHECK: "1"
          ANTHROPIC_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          VOYAGE_API_KEY: ""
          QDRANT_URL: ""
        run: |
          node dist/index.js scan secrets
          node dist/index.js scan env-audit
          node dist/index.js scan sbom --unpinned-only
          node dist/index.js audit . --dry-run --max-files 20

      - name: Pack package
        run: npm pack --dry-run
